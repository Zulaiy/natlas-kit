[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "natlaskit-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20", "natlaskit"]

[tool.hatch.build.targets.wheel]
packages = ["src/natlaskit_api"]
