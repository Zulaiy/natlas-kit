[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "natlaskit"
version = "0.1.0"
description = "Developer tools for official N-ATLAS speech models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
natlaskit = "natlaskit.cli:main"

[project.optional-dependencies]
local = ["torch>=2.4", "transformers>=4.56,<6", "numpy>=1.26"]

[tool.hatch.build.targets.wheel]
packages = ["src/natlaskit"]
